<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EV-TRACS">
    <link rel="apple-touch-icon" href="static/images/icon-192x192.png">

    <title>Global parameters — EV-TRACS</title>

    <script>
      // Set before paint so moving between pages never flashes the other theme.
      try {
        var savedTheme = localStorage.getItem("evtracs.theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-bs-theme", savedTheme);
        }
      } catch (e) {}
    </script>

    <link href="static/css/bootstrap.css" rel="stylesheet">
    <link href="static/icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/apple.css" rel="stylesheet">
  </head>

  <body id="body">
    <div id="site-nav"></div>

    <div class="ap-shell ap-shell-narrow">
      <header class="ap-page-head">
        <p class="ap-eyebrow mb-2">Global</p>
        <h1>Global parameters</h1>
        <p class="ap-lead mt-2">
          What applies across every scenario rather than to any one of them:
          the setup each run depends on, and the values calibrated once and
          applied to all of them.
        </p>
      </header>

      <div id="pageError" hidden></div>

      <div id="globals"></div>

      <div class="ap-form-actions">
        <a id="downloadLink" class="btn btn-primary" href="#" download hidden>
          <i class="bi bi-download"></i> Download road speeds
        </a>
        <a href="index.html" class="btn btn-secondary">Scenarios</a>
      </div>
    </div>

    <script src="static/js/bootstrap.bundle.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/global.js"></script>
    <script src="static/js/register-sw.js"></script>
  </body>
</html>
