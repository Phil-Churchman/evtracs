<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EV-TRACS">
    <link rel="apple-touch-icon" href="static/images/icon-192x192.png">

    <title>Scenarios — EV-TRACS</title>

    <link href="static/css/bootstrap.css" rel="stylesheet">
    <link href="static/icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/apple.css" rel="stylesheet">
  </head>

  <body id="body">
    <div id="site-nav"></div>

    <div class="ap-shell ap-shell-narrow">
      <header class="ap-page-head">
        <p class="ap-eyebrow mb-2">Scenarios</p>
        <h1>Published scenarios</h1>
        <p class="ap-lead mt-2">
          Choose which scenario the site shows. The list is fixed — it comes
          from <span class="ap-mono">data/scenarios.json</span>.
        </p>
      </header>

      <div id="pageError" hidden></div>

      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between gap-2">
          <span class="card-title d-flex align-items-center gap-2">
            <i class="bi bi-collection text-body-secondary"></i> All scenarios
          </span>
          <span class="ap-eyebrow" id="scenarioCount"></span>
        </div>
        <ul class="list-group list-group-flush" id="scenarioList"></ul>
      </div>
    </div>

    <script src="static/js/bootstrap.bundle.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/scenarios.js"></script>
    <script src="static/js/register-sw.js"></script>
  </body>
</html>
