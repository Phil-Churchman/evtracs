<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EV-TRACS">
    <link rel="apple-touch-icon" href="static/images/icon-192x192.png">

    <title>Outputs — EV-TRACS</title>

    <link href="static/css/bootstrap.css" rel="stylesheet">
    <link href="static/icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/apple.css" rel="stylesheet">
  </head>

  <body id="body">
    <div id="site-nav"></div>

    <div class="ap-shell ap-shell-wide">
      <header class="ap-page-head">
        <p class="ap-eyebrow mb-2">
          <a href="scenarios.html" class="ap-back"><i class="bi bi-chevron-left"></i> Scenarios</a>
        </p>
        <h1 id="scenarioName">Outputs</h1>
        <p class="ap-lead mt-2">
          Charts this scenario's run produced. Pick one to view it.
        </p>
      </header>

      <div id="pageError" hidden></div>

      <div class="row g-3 g-lg-4" id="layout" hidden>
        <div class="col-12 col-lg-4">
          <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between gap-2">
              <span class="card-title d-flex align-items-center gap-2">
                <i class="bi bi-images text-body-secondary"></i> Charts
              </span>
              <span class="ap-eyebrow" id="outputCount"></span>
            </div>
            <ul class="list-group list-group-flush" id="outputList"></ul>
          </div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between gap-2">
              <span class="card-title" id="viewerTitle">Select a chart</span>
              <a id="fullSizeLink" class="btn btn-sm btn-outline-secondary" href="#"
                 target="_blank" rel="noopener" hidden>
                <i class="bi bi-arrows-fullscreen"></i> Full size
              </a>
            </div>
            <div class="card-body">
              <div class="ap-chart-frame" id="viewer"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="empty" hidden></div>
    </div>

    <script src="static/js/bootstrap.bundle.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/outputs.js"></script>
    <script src="static/js/register-sw.js"></script>
  </body>
</html>
