<style>
  /* Opt-in utilities shared across pages.
     Visual design lives in static/css/apple.css — keep this file for
     behaviour-ish helpers only (cursors, selection, print/export tweaks). */

  /* Cursor affordances -------------------------------------------------- */
  .static    { cursor: not-allowed; }
  .editable  { cursor: pointer; }
  .draggable { cursor: pointer; }
  .hidden    { display: none; }

  /* Non-selectable canvas/SVG labels ------------------------------------ */
  .patchtext,
  .label,
  .axistext,
  .ticktext {
    cursor: default;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    pointer-events: none;
    font-family: var(--ap-font-sans);
  }

  .nodetext,
  .ganttbar { cursor: pointer; font-family: var(--ap-font-sans); }

  #svg-canvas * { touch-action: manipulation; }

  .no-scroll {
    overflow: hidden;
    touch-action: none;
  }

  .fixed-button { z-index: 1000; }

  /* Scrollable tables with a pinned first column ------------------------ */
  .table-fixed {
    table-layout: fixed;
    width: 100%;
  }

  .table-responsive {
    overflow-x: auto;
    max-height: 100%;
  }

  .sticky-col {
    position: sticky;
    left: 0;
    background-color: var(--ap-surface);
    z-index: 2;
  }

  .fixed-col-1 { width: 150px; }
  .fixed-col-2 { width: 200px; }

  .table-responsive thead th {
    position: sticky;
    top: 0;
    background-color: var(--ap-surface-2);
    z-index: 3;
  }

  .table-responsive thead .sticky-col { z-index: 4; }

  /* Export mode: strip chrome so screenshots/prints stay clean ---------- */
  .export-mode,
  .export-mode * {
    border: none !important;
    box-shadow: none !important;
  }

  /* Range inputs lose their track when borders are stripped, so redraw it
     as a background gradient. */
  .export-mode input[type="range"].form-range {
    appearance: none !important;
    -webkit-appearance: none !important;
    background-color: transparent !important;
    background-image: linear-gradient(
      to bottom,
      transparent calc(50% - 3px),
      var(--ap-fill) calc(50% - 3px),
      var(--ap-fill) calc(50% + 3px),
      transparent calc(50% + 3px)
    ) !important;
    background-repeat: no-repeat !important;
    background-position: center !important;
    width: 100% !important;
  }

  .export-mode input[type="range"].form-range::-webkit-slider-thumb {
    appearance: none !important;
    -webkit-appearance: none !important;
    height: 1rem !important;
    width: 1rem !important;
    border-radius: 50% !important;
    background-color: var(--ap-blue) !important;
    border: none !important;
    margin-top: 0 !important;
  }
</style>
