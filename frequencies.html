<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EV-TRACS">
    <link rel="apple-touch-icon" href="static/images/icon-192x192.png">

    <title>Demand frequencies — EV-TRACS</title>

    <script>
      // Set before paint so moving between pages never flashes the other theme.
      try {
        var savedTheme = localStorage.getItem("evtracs.theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-bs-theme", savedTheme);
        }
      } catch (e) {}
    </script>

    <link href="static/css/bootstrap.css" rel="stylesheet">
    <link href="static/icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/apple.css" rel="stylesheet">
  </head>

  <body id="body">
    <div id="site-nav"></div>

    <div class="ap-shell ap-shell-wide">
      <header class="ap-page-head">
        <p class="ap-eyebrow mb-2">
          <a href="scenario.html" class="ap-back"><i class="bi bi-chevron-left"></i> Scenario</a>
        </p>
        <h1 id="scenarioName">Demand frequencies</h1>
        <p class="ap-lead mt-2">How often trips are generated between each pair of places, through the day and across the week.</p>
      </header>

      <div id="pageError" hidden></div>

      <div class="row g-3 g-lg-4">
        <div class="col-12 col-lg-4">
          <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between gap-2">
              <span class="card-title d-flex align-items-center gap-2">
                <i class="bi bi-bar-chart-steps text-body-secondary"></i> Frequencies
              </span>
              <span class="ap-pill" id="panelOrigin" hidden></span>
            </div>
            <div class="card-body">

              <div id="panelSummary"></div>

              <div class="d-grid gap-2">
                <label class="btn btn-sm btn-outline-secondary mb-0" for="panelFile">
                  <i class="bi bi-upload"></i> Open a file
                </label>
                <input type="file" id="panelFile" accept=".json" hidden>

                <button type="button" id="panelExport" class="btn btn-primary" disabled>
                  <i class="bi bi-download"></i> Export
                </button>
                <button type="button" id="panelReset" class="btn btn-secondary" disabled>
                  <i class="bi bi-arrow-counterclockwise"></i> Back to published
                </button>
              </div>

              <div id="panelStatus" class="ap-hint mt-3 mb-0" role="status" aria-live="polite"></div>

              <p class="ap-hint mt-2 mb-0">
                <i class="bi bi-info-circle"></i>
                This site is read-only. Export anything you want to keep.
              </p>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between gap-2">
              <span class="card-title">Flows</span>
              <span class="ap-eyebrow" id="flowCount"></span>
            </div>
            <div class="card-body">
              <div id="flows"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="static/js/bootstrap.bundle.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/file-panel.js"></script>
    <script src="static/js/frequencies.js"></script>
    <script src="static/js/register-sw.js"></script>
  </body>
</html>
