# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# The site is static: there is nothing to build, so the checkout is uploaded as
# it stands. The App Service itself still needs a startup command that serves
# the files, for example:
#   pm2 serve /home/site/wwwroot --no-daemon
# and SCM_DO_BUILD_DURING_DEPLOYMENT can be turned off - there is no Oryx build
# to run.

name: Deploy static site to Azure Web App - evtracs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: |
            .
            !.git/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: static-site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_77693C028DD34758BE36E81A079B4762 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD4B5E86AF5C42E789CA2F5EF86CFC44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A796100793D2438DB67ABF72C59EEA8E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'evtracs'
          slot-name: 'Production'
